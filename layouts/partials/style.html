<style>
  :root {
    --width: 720px;
    --font-main: Verdana, sans-serif;
    --font-secondary: Verdana, sans-serif;
    --font-scale: 0.95em;
  }

  :root[data-theme="light"] {
    --background-color: #fff;
    --heading-color: #222;
    --text-color: #444;
    --link-color: #3273dc;
    --visited-color: #8b6fcb;
    --blockquote-color: #222;
  }

  :root[data-theme="dark"] {
    --background-color: #000a25;
    --heading-color: #eee;
    --text-color: #ddd;
    --link-color: #63d8f2;
    --visited-color: #8b6fcb;
    --blockquote-color: #ccc;
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.5;
    color: var(--text-color);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  nav {
    margin-top: -12px;
    position: relative;
    margin-bottom: 30px;
    padding-bottom: 12px;
  }

  nav a {
    margin-right: 8px;
    font-size: 14px;
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: monospace;
    font-style: normal;
    font-size: 15px;
  }

  main {
    line-height: 1.6;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed;
  }

  img {
    max-width: 100%;
  }

  code {
    font-family: monospace;
    padding: 2px;
    border-radius: 3px;
  }

  blockquote {
    border-left: 1px solid #999;
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }

  footer {
    padding: 25px 0;
    text-align: center;
  }

  .title:hover {
    text-decoration: none;
  }

  .title h1 {
    font-size: 1.5em;
  }

  .inline {
    width: auto !important;
  }

  .highlight,
  .code {
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  /* blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }

  img {
    display: block;
    margin-left: auto;
    margin-right: auto;
    margin-top: 1em;
    margin-bottom: 1em;
  }
</style>

<script>
  const LOCAL_STORAGE_KEY = "victorheringer.blog.theme";
  const savedTheme = localStorage.getItem(LOCAL_STORAGE_KEY) || "dark";
  document.documentElement.setAttribute("data-theme", savedTheme);

  document.addEventListener("DOMContentLoaded", () => {
    const themeToggle = document.createElement("a");
    themeToggle.href = "#";
    themeToggle.textContent = savedTheme === "dark" ? "Light" : "Dark";
    themeToggle.style.cssText =
      "cursor: pointer; margin-right: 8px; text-decoration: none;";

    themeToggle.onclick = (e) => {
      e.preventDefault();
      const current = document.documentElement.getAttribute("data-theme");
      const newTheme = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem(LOCAL_STORAGE_KEY, newTheme);
      themeToggle.textContent = newTheme === "dark" ? "Light" : "Dark";
    };

    const nav = document.querySelector("nav");

    if (nav) {
      nav.appendChild(themeToggle);
    } else {
      const newNav = document.createElement("nav");
      newNav.appendChild(themeToggle);

      const header = document.querySelector("header");
      if (header) {
        header.parentNode.insertBefore(newNav, header.nextSibling);
      } else {
        document.body.insertBefore(newNav, document.body.firstChild);
      }
    }
  });
</script>
